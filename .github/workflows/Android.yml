
name: Build vMix Remote APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP" -d source

      - name: Build APK
        run: gradle -p source assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vMixRemote-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
